<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sana School Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gradient-to-br from-blue-900 to-blue-600 min-h-screen flex items-center justify-center">
    <div class="bg-white rounded-2xl shadow-xl p-8 w-full max-w-md">
        <div class="text-center mb-6">
            <h1 class="text-3xl font-bold text-gray-800">🏫 Sana School</h1>
            <p class="text-gray-500">Integrated Management System</p>
        </div>
        <form id="loginForm">
            <div class="mb-4">
                <label class="block text-gray-700 font-bold mb-2">Email</label>
                <input type="email" id="email" class="w-full border rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" required>
            </div>
            <div class="mb-6">
                <label class="block text-gray-700 font-bold mb-2">Password</label>
                <input type="password" id="password" class="w-full border rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" required>
            </div>
            <button type="submit" class="w-full bg-blue-700 hover:bg-blue-800 text-white font-bold py-2 rounded-lg transition">Login</button>
        </form>
        <div id="errorMsg" class="text-red-500 text-sm mt-4 text-center"></div>
        <div class="mt-6 text-center text-xs text-gray-400">
            Demo: admin@sana.edu / admin123 &nbsp;|&nbsp; teacher@sana.edu / teacher123
        </div>
    </div>
    <script>
        // Initialize Supabase
        const SUPABASE_URL = 'https://YOUR_PROJECT_ID.supabase.co';  // Replace with your URL
        const SUPABASE_ANON_KEY = 'YOUR_ANON_KEY';                   // Replace with your key
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            const { data, error } = await supabase.auth.signInWithPassword({ email, password });
            if (error) {
                document.getElementById('errorMsg').innerText = error.message;
                return;
            }
            // After login, get user role from user_roles table
            const { data: roleData, error: roleError } = await supabase
                .from('user_roles')
                .select('role')
                .eq('user_id', data.user.id)
                .single();
            if (roleError) {
                document.getElementById('errorMsg').innerText = 'Role not found. Contact admin.';
                return;
            }
            const role = roleData.role;
            if (role === 'admin') window.location.href = 'admin.html';
            else if (role === 'teacher') window.location.href = 'teacher.html';
            else if (role === 'parent') window.location.href = 'student.html';
            else window.location.href = 'index.html';
        });
    </script>
</body>
</html>

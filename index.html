<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sana School Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gradient-to-br from-blue-900 to-blue-600 min-h-screen flex items-center justify-center">
    <div class="bg-white rounded-2xl shadow-xl p-8 w-full max-w-md">
        <div class="text-center mb-6">
            <h1 class="text-3xl font-bold text-gray-800">🏫 Sana School</h1>
            <p class="text-gray-500">Integrated Management System</p>
        </div>
        <form id="loginForm">
            <div class="mb-4">
                <label class="block text-gray-700 font-bold mb-2">Email</label>
                <input type="email" id="email" class="w-full border rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" required>
            </div>
            <div class="mb-6">
                <label class="block text-gray-700 font-bold mb-2">Password</label>
                <input type="password" id="password" class="w-full border rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" required>
            </div>
            <button type="submit" class="w-full bg-blue-700 hover:bg-blue-800 text-white font-bold py-2 rounded-lg transition">Login</button>
        </form>
        <div id="errorMsg" class="text-red-500 text-sm mt-4 text-center"></div>
        <div class="mt-6 text-center text-xs text-gray-400">
            <p>Demo: admin@sana.edu / admin123 &nbsp;|&nbsp; teacher@sana.edu / teacher123</p>
            <p class="mt-1"><a href="admissions.html" class="text-blue-600 hover:underline">📢 Check Admission Availability</a></p>
        </div>
    </div>
    <script>
    const SUPABASE_URL = 'https://lctjefjgoainuycnshsr.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxjdGplZmpnb2FpbnV5Y25zaHNyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk5OTAzNzksImV4cCI6MjA5NTU2NjM3OX0.NnD2QxJjr7-zMkGFDpDl_bgiMzZm4A0jzEqDMQ8QbVA';
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;

        const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
        if (error) {
            document.getElementById('errorMsg').innerText = error.message;
            return;
        }
        const { data: roleData, error: roleError } = await supabaseClient
            .from('user_roles')
            .select('role')
            .eq('user_id', data.user.id)
            .maybeSingle();
        if (roleError || !roleData) {
            document.getElementById('errorMsg').innerText = 'Role not assigned. Contact admin.';
            return;
        }
        const role = roleData.role;
        if (role === 'admin') window.location.href = 'admin.html';
        else if (role === 'teacher') window.location.href = 'teacher.html';
        else if (role === 'parent') window.location.href = 'student.html';
        else window.location.href = 'index.html';
    });
</script>
</body>
</html>

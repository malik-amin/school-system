<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Dashboard | Sana School</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100">
    <nav class="bg-white shadow p-4 flex justify-between items-center">
        <h1 class="text-xl font-bold text-blue-800">Student/Parent Portal</h1>
        <button id="logoutBtn" class="bg-red-500 text-white px-4 py-2 rounded-lg">Logout</button>
    </nav>
    <div class="container mx-auto p-6">
        <div class="bg-white rounded-lg shadow p-6">
            <h2 class="text-2xl font-bold mb-4">📄 My Child's Result</h2>
            <div id="resultCard" class="p-4 border rounded-lg bg-gray-50">
                Loading...
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://YOUR_PROJECT_ID.supabase.co';
        const SUPABASE_ANON_KEY = 'YOUR_ANON_KEY';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function loadResult() {
            const { data: { user } } = await supabase.auth.getUser();
            if (!user) {
                window.location.href = 'index.html';
                return;
            }
            // Find student where parent_email matches logged in email
            const { data: students, error } = await supabase
                .from('students')
                .select('id, name, class_id, classes(name)')
                .eq('parent_email', user.email);
            if (error || !students || students.length === 0) {
                document.getElementById('resultCard').innerHTML = '<p class="text-red-500">No student linked to this email.</p>';
                return;
            }
            const student = students[0];
            // Fetch latest result for this student (e.g., most recent academic_year and term)
            const { data: results, error: resError } = await supabase
                .from('results')
                .select('*')
                .eq('student_id', student.id)
                .order('academic_year', { ascending: false })
                .order('term', { ascending: false })
                .limit(1);
            if (resError || !results || results.length === 0) {
                document.getElementById('resultCard').innerHTML = `
                    <p><strong>Name:</strong> ${student.name}</p>
                    <p><strong>Class:</strong> ${student.classes?.name || '-'}</p>
                    <p class="text-yellow-600 mt-2">Result not published yet.</p>
                `;
                return;
            }
            const res = results[0];
            document.getElementById('resultCard').innerHTML = `
                <p><strong>Name:</strong> ${student.name}</p>
                <p><strong>Class:</strong> ${student.classes?.name || '-'}</p>
                <hr class="my-2">
                <p><strong>Percentage:</strong> ${res.percentage}%</p>
                <p><strong>Grade:</strong> <span class="font-bold text-green-700">${res.grade}</span></p>
                <p class="text-sm text-gray-500 mt-2">Academic Year: ${res.academic_year} | Term: ${res.term}</p>
            `;
        }

        loadResult();

        document.getElementById('logoutBtn').addEventListener('click', async () => {
            await supabase.auth.signOut();
            window.location.href = 'index.html';
        });
    </script>
</body>
</html>
